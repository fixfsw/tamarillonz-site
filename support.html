<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Support — Tamarillo Timer</title>
    <meta name="description" content="Support and contact for Tamarillo Timer, a minimal menu bar break reminder for macOS.">
    <meta name="robots" content="noindex, follow">

    <link rel="canonical" href="https://tamarillo.nz/support.html">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tamarillo.css">
    <script src="theme.js" defer></script>

    <script data-goatcounter="https://fixf.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>

    <div class="theme-toggle" role="radiogroup" aria-label="Theme">
      <button type="button" data-theme-choice="light" role="radio" aria-checked="false" aria-label="Light" title="Light">
        <svg class="theme-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <line x1="12" y1="2" x2="12" y2="4.5"/>
            <line x1="12" y1="19.5" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="4.5" y2="12"/>
            <line x1="19.5" y1="12" x2="22" y2="12"/>
            <line x1="4.93" y1="4.93" x2="6.64" y2="6.64"/>
            <line x1="17.36" y1="17.36" x2="19.07" y2="19.07"/>
            <line x1="4.93" y1="19.07" x2="6.64" y2="17.36"/>
            <line x1="17.36" y1="6.64" x2="19.07" y2="4.93"/>
          </g>
        </svg>
      </button>
      <button type="button" data-theme-choice="auto" role="radio" aria-checked="true" aria-label="Match system" title="Match system">
        <svg class="theme-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/>
        </svg>
      </button>
      <button type="button" data-theme-choice="dark" role="radio" aria-checked="false" aria-label="Dark" title="Dark">
        <svg class="theme-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <div class="content archive-header">
      <a href="/"><h1>Support</h1></a>
    </div>

    <div class="content prose">
      <p>Questions, feedback, or something not working as expected? Get in touch:</p>
      <p><a href="mailto:support@fixf.dev">support@fixf.dev</a></p>

      </p>

  </body>
</html>
